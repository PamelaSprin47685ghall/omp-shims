name: Bug report
description: Something in omp-shims does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please never paste API keys, tokens, or account e-mail addresses. Redact them.
        Diagnostics go to stderr; `OMP_SHIMS_VERBOSE=1` adds detail.
  - type: dropdown
    id: feature
    attributes:
      label: Feature
      description: Which v2 feature is involved? `omp-shims status` lists them.
      options:
        - gateway-compat
        - sse-heartbeat
        - reasoning-order
        - tool-id-hash
        - antigravity
        - copilot-auto
        - lazy-router
        - cline-pin-upstream
        - ipv6-first
        - plugin-bridge
        - models-bridge
        - traffic-log
        - kiro-credential-sync
        - CLI, systemd, migration, or configuration
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: doctor
    attributes:
      label: Doctor and status
      description: Output of `omp-shims doctor` and `omp-shims status --json`, redacted.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output with `OMP_SHIMS_VERBOSE=1`, redacted.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: omp-shims version, `omp --version`, `bun --version`, OS.
    validations:
      required: true
