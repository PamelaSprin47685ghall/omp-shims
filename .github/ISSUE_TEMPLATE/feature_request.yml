name: Feature request
description: Propose a new shim, a new setting, or an improvement to an existing feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What breaks or misbehaves without this? Which provider or upstream?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Which v2 feature changes, or which new feature is needed? Name its install phase.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The settings this needs in `~/.omp/shims.json`, with defaults.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
